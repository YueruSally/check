[model]
quantity_unit = "FEU"
objectives = ["total_cost_usd", "quantity_weighted_mean_delivery_time_h"]
active_scenario = "pilot_baseline"

[constraints]
enforce_timetable = true
enforce_capacity = true
hard_due_time = false
allow_split = true
max_paths_per_shipment = 3
min_path_share = 0.10
max_legs_per_path = 8
max_mode_changes = 4
allocation_tolerance_feu = 0.000001

[operational_costs]
# Workbook rates are USD/TEU-hour; multiply by 2 for the FEU model.
holding_usd_per_feu_h = 1.6
processing_usd_per_feu_h = 1.6

[penalties]
# Shipment-specific rates from the batch sheets override this fallback.
tardiness_usd_per_feu_h = 0.0
infeasible_objective = 1000000000000000.0

[nsga2]
population_size = 48
generations = 40
crossover_rate = 0.9
mutation_rate = 0.12
max_paths_per_gateway = 4
seed = 20260906

[scenarios.pilot_baseline]
panama_availability_multiplier = 1.0
uswc_ocean_cost_multiplier = 1.0
usec_ocean_cost_multiplier = 1.0
port_capacity_multiplier = 1.0
uswc_port_capacity_multiplier = 1.0
usec_port_capacity_multiplier = 1.0
la_lb_port_capacity_multiplier = 1.0
seattle_tacoma_port_capacity_multiplier = 1.0
uswc_ocean_departure_delay_h = 0.0
usec_ocean_departure_delay_h = 0.0
la_lb_ocean_departure_delay_h = 0.0
seattle_tacoma_ocean_departure_delay_h = 0.0
demand_multiplier = 1.0

# Historical one-factor scenarios retained for reproducibility.
[scenarios.panama_restricted]
panama_availability_multiplier = 0.9

[scenarios.panama_stress]
panama_availability_multiplier = 0.8

[scenarios.freight_gap_low]
usec_ocean_cost_multiplier = 0.9090817963

[scenarios.freight_gap_high]
usec_ocean_cost_multiplier = 1.1195870088

[scenarios.port_capacity_80pct]
port_capacity_multiplier = 0.8

[scenarios.demand_125pct]
demand_multiplier = 1.25

# v0.5 non-carbon port-capacity scenarios.
[scenarios.uswc_port_capacity_125pct]
uswc_port_capacity_multiplier = 1.25

[scenarios.uswc_port_capacity_75pct]
uswc_port_capacity_multiplier = 0.75

[scenarios.uswc_port_capacity_50pct]
uswc_port_capacity_multiplier = 0.50

# v0.8 focused NY/NJ activation thresholds; no carbon variables.
[scenarios.uswc_departure_delay_264h]
uswc_ocean_departure_delay_h = 264.0

[scenarios.uswc_departure_delay_288h]
uswc_ocean_departure_delay_h = 288.0

[scenarios.uswc_departure_delay_312h]
uswc_ocean_departure_delay_h = 312.0

[scenarios.uswc_compound_35pct_delay_168h]
uswc_port_capacity_multiplier = 0.35
uswc_ocean_departure_delay_h = 168.0

# v0.5 fixed departure-delay scenarios. Delay is added after the published
# sailing departure and therefore increases both port waiting cost and arrival time.
[scenarios.uswc_departure_delay_24h]
uswc_ocean_departure_delay_h = 24.0

[scenarios.uswc_departure_delay_72h]
uswc_ocean_departure_delay_h = 72.0

[scenarios.all_departure_delay_48h]
uswc_ocean_departure_delay_h = 48.0
usec_ocean_departure_delay_h = 48.0

# v0.5 compound West Coast disruption scenarios.
[scenarios.uswc_compound_moderate]
uswc_port_capacity_multiplier = 0.75
uswc_ocean_departure_delay_h = 24.0

[scenarios.uswc_compound_severe]
uswc_port_capacity_multiplier = 0.50
uswc_ocean_departure_delay_h = 72.0

# v0.6 capacity-threshold refinement.
[scenarios.uswc_port_capacity_70pct]
uswc_port_capacity_multiplier = 0.70

[scenarios.uswc_port_capacity_65pct]
uswc_port_capacity_multiplier = 0.65

[scenarios.uswc_port_capacity_60pct]
uswc_port_capacity_multiplier = 0.60

# v0.6 gateway-specific capacity scenarios.
[scenarios.la_lb_port_capacity_50pct]
la_lb_port_capacity_multiplier = 0.50

[scenarios.seattle_tacoma_port_capacity_50pct]
seattle_tacoma_port_capacity_multiplier = 0.50

# v0.6 gateway-specific and extended West Coast delay scenarios.
[scenarios.la_lb_departure_delay_72h]
la_lb_ocean_departure_delay_h = 72.0

[scenarios.seattle_tacoma_departure_delay_72h]
seattle_tacoma_ocean_departure_delay_h = 72.0

[scenarios.uswc_departure_delay_96h]
uswc_ocean_departure_delay_h = 96.0

[scenarios.uswc_departure_delay_120h]
uswc_ocean_departure_delay_h = 120.0

[scenarios.uswc_departure_delay_168h]
uswc_ocean_departure_delay_h = 168.0

# v0.6 severe compound disruption.
[scenarios.uswc_compound_50pct_delay_120h]
uswc_port_capacity_multiplier = 0.50
uswc_ocean_departure_delay_h = 120.0

# v0.7 non-carbon activation and threshold scenarios.
[scenarios.uswc_port_capacity_675pct]
uswc_port_capacity_multiplier = 0.675

[scenarios.uswc_departure_delay_240h]
uswc_ocean_departure_delay_h = 240.0

[scenarios.uswc_departure_delay_336h]
uswc_ocean_departure_delay_h = 336.0

[scenarios.uswc_compound_30pct_delay_168h]
uswc_port_capacity_multiplier = 0.30
uswc_ocean_departure_delay_h = 168.0

[scenarios.uswc_compound_40pct_delay_168h]
uswc_port_capacity_multiplier = 0.40
uswc_ocean_departure_delay_h = 168.0
